name: Check public ABI

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-check:
    # macOS so the Apple targets are actually compiled. On a Linux runner the klib dump would fall
    # back to the recorded declarations for those targets (keepLocallyUnsupportedTargets), which
    # would let an Apple-only ABI break through unnoticed.
    runs-on: macos-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.0.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Verify public ABI against committed dump
        run: ./gradlew -DLibrariesOnly=true apiCheck --stacktrace
      - name: Explain failure
        if: failure()
        run: |
          echo "::error::The public ABI changed but the committed dump was not updated."
          echo ""
          echo "If the change is intentional, run:"
          echo "    ./gradlew -DLibrariesOnly=true apiDump"
          echo "and commit the updated files under */api/."
          echo ""
          echo "Review that diff carefully before committing it: a removed or altered line is a"
          echo "binary-incompatible change for already-compiled consumers and needs a major"
          echo "version bump per SemVer 2.0.0, or a deprecation cycle first."
