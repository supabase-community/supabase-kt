project_id = "supabase-kt-tests"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

# Vector buckets are backed by pgvector in the local stack.
[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 10

# The CLI only applies this to linked hosted projects and never enables analytics (Iceberg) buckets locally.
# Run ./script/enable-analytics.sh from the repository root after `supabase start` to enable the bucket API for the integration tests.
[storage.analytics]
enabled = false

[edge_runtime]
enabled = true
